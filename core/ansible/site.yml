---
- name: CodeFarm organism baseline
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify CodeFarm path exists
      ansible.builtin.debug:
        msg: "CodeFarm baseline loaded"

    # Added by org-002 at 2026-05-16T17:13:58.405524+00:00
    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
      tags: security

